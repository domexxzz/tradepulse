# เฝ้าดูบริดจ์ TradingView จากคลาวด์ GitHub (ฟรี ไม่ต้องใช้ Vercel Pro)
# ปิง endpoint เฝ้าระวังของเว็บทุก ~10 นาที ถ้าบริดจ์หลัก (server-254) ล่ม
# endpoint จะแจ้งเตือนแอดมินทาง Telegram เอง
#
# ต้องตั้ง repo secret: CRON_SECRET (ค่าเดียวกับบน Vercel) — ตั้งไว้แล้ว
# GitHub cron เป็น best-effort อาจดีเลย์ 5-15 นาที ซึ่งพอสำหรับเตือนเครื่องดับ
name: bridge-health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # กดรันเองได้จากหน้า Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bridge-health endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # ส่ง secret ผ่าน header (curl --get + --data-urlencode ก็ได้ แต่ header ชัวร์กว่า)
          code=$(curl -s -o body.txt -w "%{http_code}" -m 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://quantvisionx.com/api/cron/bridge-health")
          echo "HTTP ${code}"
          cat body.txt || true
          echo ""
          # 200 = เช็กสำเร็จ (บริดจ์จะปกติหรือล่มก็ได้ endpoint จัดการเอง)
          # ไม่ 200 = เว็บเองมีปัญหา ให้ job แดงเพื่อให้ GitHub เตือน
          if [ "${code}" != "200" ]; then
            echo "endpoint ไม่ตอบ 200"
            exit 1
          fi
