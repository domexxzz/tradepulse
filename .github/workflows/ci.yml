# ตรวจงานทุก PR ก่อน merge
#
# มีไว้เพราะ Vercel preview บอกได้แค่ว่า "build ผ่านไหม" แต่ไม่ได้รันเทสต์
# ตรรกะที่พลาดแล้วเสียเงินจริง (วันหมดอายุ ราคาโปร การล็อกราคา) อยู่ในชุด UAT
# ซึ่งต้องมีฐานข้อมูลจริงถึงจะรันได้ ตัวนี้เลยยก Postgres ขึ้นมาให้ในงานเลย
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qvx
          POSTGRES_PASSWORD: devpass
          # ชื่อต้องมีคำว่า test ไม่งั้น uat/guard.ts จะปฏิเสธไม่ยอมรัน
          POSTGRES_DB: qvx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://qvx:devpass@127.0.0.1:5432/qvx_test?schema=public
      DIRECT_URL: postgresql://qvx:devpass@127.0.0.1:5432/qvx_test?schema=public
      # ค่าปลอมสำหรับ build เท่านั้น ไม่ใช่ความลับจริง
      AUTH_SECRET: ci-build-only-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # โฟลเดอร์โปรเจกต์อยู่บน Desktop ที่ iCloud sync อยู่ มันสร้างไฟล์ก๊อปชื่อลงท้าย
      # " 2" ขึ้นมาเองหลังเขียนไฟล์ชุดใหญ่ ซึ่งเคยหลุดเข้าไปใน .next/types/ แล้วทำให้
      # tsc แดงด้วย "Duplicate identifier" มาแล้ว ถ้าหลุดเข้ารีโปจะพังแบบหาสาเหตุยาก
      #
      # ไม่ใส่ pattern นี้ใน .gitignore เพราะจะกลบไฟล์จริงที่บังเอิญชื่อลงท้ายด้วยเลข
      # ตอนเขียนด่านนี้ไม่มีไฟล์ที่ติดตามอยู่ชื่อมีช่องว่างเลยสักไฟล์ จึงไม่มี false positive
      - name: กันไฟล์ก๊อปจาก iCloud หลุดเข้ารีโป
        run: |
          dupes=$(git ls-files | grep -E ' [0-9]+(\.[^/]+)?$' || true)
          if [ -n "$dupes" ]; then
            echo "เจอไฟล์ก๊อปที่ถูก commit เข้ามา:"
            echo "$dupes" | sed 's/^/  /'
            echo ""
            echo "ไฟล์พวกนี้มาจาก iCloud ไม่ใช่งานจริง — ลบแล้ว commit ใหม่"
            exit 1
          fi
          echo "ไม่มีไฟล์ก๊อป"

      # PowerShell 5.1 บนคอมเฟิร์ส (Windows) เดาว่าไฟล์ไม่มี BOM เป็น ANSI
      # ภาษาไทยในสคริปต์จะกลายเป็นขยะแล้ว parser ล้มทันที — สคริปต์ไม่ทำงานเลย
      # ที่รันอยู่บนเครื่องนั้นมี BOM เพราะคนใส่ให้ตอน copy ซึ่งลืมได้ง่าย
      # เช็คที่นี่แทน ให้ scp จากรีโปตรง ๆ ใช้ได้เสมอ
      - name: สคริปต์ PowerShell ต้องมี UTF-8 BOM
        run: |
          bad=""
          for f in $(git ls-files '*.ps1'); do
            if [ "$(head -c 3 "$f" | xxd -p)" != "efbbbf" ]; then bad="$bad$f\n"; fi
          done
          if [ -n "$bad" ]; then
            echo "ไฟล์ .ps1 ที่ไม่มี BOM (ภาษาไทยจะเพี้ยนบน PowerShell 5.1):"
            printf "$bad" | sed 's/^/  /'
            echo ""
            echo "แก้ด้วย: printf '\\xef\\xbb\\xbf' | cat - FILE > tmp && mv tmp FILE"
            exit 1
          fi
          echo "สคริปต์ PowerShell มี BOM ครบ"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependency
        run: npm ci

      - name: สร้างตาราง
        run: npx prisma migrate deploy

      - name: เทสต์ตรรกะ
        run: npm test

      - name: เทสต์กับฐานข้อมูลจริง
        run: npm run test:uat

      - name: build
        run: npx next build

      - name: ตรวจ lint
        run: npm run lint

  # ดัน production เอง เพราะ Vercel บล็อก deploy ที่ commit author ไม่มีสิทธิ์ในโปรเจกต์
  # (โปรเจกต์อยู่บัญชีโดม คน merge คือเบส) ก่อนหน้านี้ต้องรันสคริปต์เองหลัง merge ทุกครั้ง
  # ซึ่งลืมได้ง่าย และลืมไปแล้วจริงกับ #31 — เว็บค้างของเก่าอยู่เงียบ ๆ หลายชั่วโมง
  #
  # deployment ที่สร้างจาก token ไม่ผูกกับ commit author จึงไม่โดนบล็อก
  # ต้องตั้ง repo secret: VERCEL_TOKEN (project token ของ tradepulse)
  # ถ้าย้ายบัญชี Vercel สำเร็จเมื่อไหร่ ลบ job นี้กับ scripts/deploy-vercel.mjs ทิ้งได้เลย
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # กัน deploy ซ้อนกันเมื่อ merge ติด ๆ กัน — ปล่อยตัวที่รันอยู่ให้จบก่อน ไม่ cancel
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ดันขึ้น production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "ยังไม่ได้ตั้ง repo secret VERCEL_TOKEN — ดู scripts/deploy-vercel.mjs"
            exit 1
          fi
          node scripts/deploy-vercel.mjs
